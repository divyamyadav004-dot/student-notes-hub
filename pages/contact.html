<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact & Feedback | Studix</title>
    <link rel="stylesheet" href="../css/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container navbar">
        <a class="brand" href="../index.html">Studix</a>
        <button class="nav-toggle" type="button" data-nav-toggle>☰ Menu</button>
        <nav class="nav-links" data-nav-links>
          <a href="../index.html">Home</a>
          <a href="notes.html">Notes</a>
          <a href="pyqs.html">PYQs</a>
          <a href="important-topics.html">Important Topics</a>
          <a href="syllabus.html">Syllabus</a>
          <a href="about.html">About</a>
          <a class="active" href="contact.html">Contact</a>
        </nav>
      </div>
    </header>

    <main class="section">
      <div class="container">
        <h1>Contact / Feedback</h1>
        <div class="card">
          <form data-feedback-form>
            <div class="form-group">
              <label for="name">Name</label>
              <input id="name" name="name" type="text" required />
            </div>

            <div class="form-group">
              <label for="email">Email</label>
              <input id="email" name="email" type="email" required />
            </div>

            <div class="form-group">
              <label for="message">Message</label>
              <textarea id="message" name="message" required></textarea>
            </div>

            <button class="btn" type="submit">Send Feedback</button>
          </form>
        </div>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container footer-content">
        <p>&copy; 2026 Studix. Built for students.</p>
        <a href="disclaimer.html">Disclaimer</a>
      </div>
    </footer>

    <script src="../js/main.js"></script>
  </body>
</html>
